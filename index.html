<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Warcraft TS Comms - Realtime</title>

  <style>
    :root {
      --bg-dark: #07090e;
      --panel-bg: rgba(16, 20, 28, 0.95);
      --border-gold: #c89b3c;
      --border-gold-dark: #6e5223;
      --text-gold: #f0ac00;
      --text-light: #cdbe91;
      --accent-green: #38a169;
    }

    body.theme-horde { --border-gold: #a32222; --border-gold-dark: #540e0e; --text-gold: #ff4d4d; background: #0d0505; }
    body.theme-alliance { --border-gold: #2b6cb0; --border-gold-dark: #1a365d; --text-gold: #63b3ed; background: #050b14; }
    body.theme-lichking { --border-gold: #319795; --border-gold-dark: #1d4044; --text-gold: #76e4f7; background: #040e14; }
    body.theme-bc { --border-gold: #38a169; --border-gold-dark: #1c4532; --text-gold: #68d391; background: #041208; }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; user-select: none; }
    body { background-color: var(--bg-dark); color: var(--text-light); display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    .app-container { width: 100%; max-width: 900px; height: 100vh; max-height: 800px; background: var(--panel-bg); border: 2px solid var(--border-gold-dark); display: flex; flex-direction: column; position: relative; }
    .header { padding: 10px 14px; border-bottom: 2px solid var(--border-gold-dark); display: flex; justify-content: space-between; align-items: center; background: rgba(0, 0, 0, 0.4); }
    .header h1 { color: var(--text-gold); font-size: 1.1rem; text-transform: uppercase; }
    .theme-selector select { background: #0a0d12; color: var(--text-light); border: 1px solid var(--border-gold-dark); padding: 4px; border-radius: 4px; }
    .main-layout { flex: 1; display: flex; overflow: hidden; position: relative; }
    .mobile-nav { display: flex; background: rgba(8, 11, 16, 0.98); border-top: 2px solid var(--border-gold-dark); }
    @media (min-width: 768px) { .mobile-nav { display: none; } }
    .nav-btn { flex: 1; padding: 12px 0; background: transparent; border: none; color: #718096; font-weight: bold; font-size: 0.8rem; text-transform: uppercase; }
    .nav-btn.active { color: var(--text-gold); border-top: 3px solid var(--border-gold); background: rgba(200, 155, 60, 0.08); }
    .panel-section { flex: 1; display: flex; flex-direction: column; padding: 12px; overflow-y: auto; }
    @media (max-width: 767px) { .panel-section.mobile-hidden { display: none !important; } }
    .channels-panel { width: 100%; border-right: 1px solid var(--border-gold-dark); }
    @media (min-width: 768px) { .channels-panel { width: 320px; } }
    .content-panel { flex: 1; display: flex; flex-direction: column; gap: 10px; }
    .section-title { font-size: 0.85rem; color: var(--text-gold); text-transform: uppercase; font-weight: bold; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
    .wow-input { width: 100%; padding: 8px 10px; background: #080a0e; border: 1px solid var(--border-gold-dark); color: #fff; border-radius: 3px; font-size: 0.85rem; outline: none; }
    .wow-btn { padding: 8px 12px; background: linear-gradient(180deg, #4a2d18 0%, #261308 100%); border: 1px solid var(--border-gold); color: var(--text-gold); font-weight: bold; font-size: 0.8rem; text-transform: uppercase; border-radius: 4px; cursor: pointer; }
    .wow-btn.btn-full { width: 100%; }
    .wow-btn.btn-danger { background: linear-gradient(180deg, #611818 0%, #300a0a 100%); border-color: #e53e3e; color: #feb2b2; }
    .channel-tree { display: flex; flex-direction: column; gap: 8px; flex: 1; overflow-y: auto; }
    .channel-card { background: rgba(10, 14, 20, 0.8); border: 1px solid var(--border-gold-dark); border-radius: 4px; padding: 10px; cursor: pointer; }
    .channel-card.active { border-color: var(--accent-green); background: rgba(15, 35, 22, 0.8); }
    .channel-header { display: flex; justify-content: space-between; align-items: center; font-size: 0.9rem; font-weight: bold; color: #fff; }
    .channel-users { margin-top: 6px; padding-left: 10px; display: flex; flex-direction: column; gap: 4px; border-left: 2px solid var(--border-gold-dark); }
    .user-tag { font-size: 0.8rem; color: var(--text-light); display: flex; align-items: center; gap: 6px; }
    .user-dot { width: 8px; height: 8px; border-radius: 50%; background: #4a5568; }
    .user-dot.speaking { background: #48bb78; box-shadow: 0 0 6px #48bb78; }
    .chat-tabs { display: flex; gap: 4px; margin-bottom: 6px; }
    .chat-tab-btn { padding: 6px 12px; background: rgba(0,0,0,0.4); border: 1px solid var(--border-gold-dark); color: #718096; font-size: 0.75rem; border-radius: 3px; cursor: pointer; }
    .chat-tab-btn.active { background: rgba(200, 155, 60, 0.15); border-color: var(--border-gold); color: var(--text-gold); }
    .chat-messages { flex: 1; background: rgba(5, 7, 10, 0.8); border: 1px solid var(--border-gold-dark); border-radius: 4px; padding: 8px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; min-height: 140px; }
    .msg-item { font-size: 0.8rem; line-height: 1.3; }
    .msg-user { color: var(--text-gold); font-weight: bold; }
    .msg-text { color: #e2e8f0; }
    .chat-input-bar { display: flex; gap: 6px; margin-top: 6px; }
    .voice-box { background: rgba(0, 0, 0, 0.4); border: 1px solid var(--border-gold-dark); padding: 10px; border-radius: 4px; display: flex; flex-direction: column; gap: 8px; }
    .ptt-btn { padding: 16px; font-size: 1rem; background: linear-gradient(180deg, #2b4c7e 0%, #132540 100%); border: 2px solid #4299e1; color: #ebf8ff; border-radius: 6px; touch-action: manipulation; }
    .ptt-btn.active { background: linear-gradient(180deg, #276749 0%, #123824 100%); border-color: #48bb78; }
    .hidden { display: none !important; }
  </style>
</head>
<body class="theme-df">

  <div class="app-container">
    <div class="header">
      <h1>WARCRAFT TS VOICE</h1>
      <div class="theme-selector">
        <select id="themeSelect" onchange="document.body.className = this.value">
          <option value="theme-df">Dragonflight</option>
          <option value="theme-horde">Horda</option>
          <option value="theme-alliance">Alianza</option>
          <option value="theme-lichking">Lich King</option>
          <option value="theme-bc">Burning Crusade</option>
        </select>
      </div>
    </div>

    <!-- PANTALLA DE INGRESO -->
    <div id="loginOverlay" class="panel-section" style="justify-content: center; align-items: center;">
      <div style="width: 100%; max-width: 320px; background: rgba(0,0,0,0.6); padding: 16px; border: 1px solid var(--border-gold); border-radius: 6px;">
        <div class="section-title">Ingresar al Servidor</div>
        <div style="margin-bottom: 10px;">
          <label style="font-size:0.75rem; color:#a0aec0;">Tu Nick:</label>
          <input type="text" id="nickInput" class="wow-input" placeholder="Ej: Thrall, Arthas..." maxlength="15">
        </div>
        <button id="connectBtn" class="wow-btn btn-full" onclick="enterServer()">Cargando Servidor...</button>
      </div>
    </div>

    <!-- LAYOUT PRINCIPAL -->
    <div id="mainContent" class="main-layout hidden">
      <div id="secChannels" class="panel-section channels-panel">
        <div class="section-title">
          <span>Canales</span>
        </div>
        <div id="channelTree" class="channel-tree"></div>
      </div>

      <div id="secChat" class="panel-section content-panel mobile-hidden">
        <div class="voice-box">
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <span style="font-size:0.8rem;">Canal: <b id="currentRoomLabel" style="color:#fff;">Ninguno</b></span>
            <span id="micStatusTag" style="font-size:0.7rem; padding:2px 6px; background:#4a5568; border-radius:10px;">SILENCIADO</span>
          </div>

          <button id="touchPttBtn" class="wow-btn ptt-btn">MANTENER PARA HABLAR</button>

          <div style="display:flex; gap:6px;">
            <button id="toggleMicBtn" class="wow-btn btn-full" onclick="toggleMic()">Mic: OFF</button>
            <button class="wow-btn btn-full btn-danger" onclick="leaveChannel()">Salir Canal</button>
          </div>
        </div>

        <div style="flex:1; display:flex; flex-direction:column;">
          <div class="chat-tabs">
            <button id="tabGenBtn" class="chat-tab-btn active" onclick="switchChatTab('general')">Chat General</button>
            <button id="tabRoomBtn" class="chat-tab-btn" onclick="switchChatTab('room')">Chat Sala</button>
          </div>

          <div id="chatBox" class="chat-messages"></div>

          <div class="chat-input-bar">
            <input type="text" id="msgInput" class="wow-input" placeholder="Escribe un mensaje..." onkeypress="if(event.key==='Enter') sendMsg()">
            <button class="wow-btn" onclick="sendMsg()">Enviar</button>
          </div>
        </div>
      </div>
    </div>

    <div id="mobileNav" class="mobile-nav hidden">
      <button id="navChanBtn" class="nav-btn active" onclick="showMobileTab('channels')">Canales</button>
      <button id="navChatBtn" class="nav-btn" onclick="showMobileTab('chat')">Chat / Voz</button>
    </div>
  </div>

  <!-- Carga segura de Scripts -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <script>
    let db = null;
    let myNick = "";
    let myId = "user_" + Math.random().toString(36).substr(2, 6);
    let currentRoom = null;
    let currentChatTab = "general";
    let localStream = null;

    let rooms = {
      lobby: { name: "Lobby Principal", users: {} },
      raid25: { name: "Raid ICC 25", users: {} },
      pvp: { name: "Arenas / PVP", users: {} }
    };

    // Carga robusta de Firebase
    function initFirebase() {
      if (typeof firebase !== 'undefined') {
        const firebaseConfig = {
          databaseURL: "https://wowts-default-rtdb.firebaseio.com"
        };
        if (!firebase.apps.length) {
          firebase.initializeApp(firebaseConfig);
        }
        db = firebase.database();
        document.getElementById('connectBtn').innerText = "Conectar";
        setupListeners();
      } else {
        setTimeout(initFirebase, 300); // Reintentar hasta que descargue la librería
      }
    }

    window.onload = () => {
      setupTouchEvents();
      if (localStorage.getItem('wow_ts_nick')) {
        document.getElementById('nickInput').value = localStorage.getItem('wow_ts_nick');
      }
      initFirebase();
    };

    function setupListeners() {
      if (!db) return;

      db.ref('presence').on('value', (snapshot) => {
        const activeUsers = snapshot.val() || {};
        Object.keys(rooms).forEach(r => rooms[r].users = {});

        Object.keys(activeUsers).forEach(uid => {
          const u = activeUsers[uid];
          if (u.room && rooms[u.room]) {
            rooms[u.room].users[uid] = u;
          }
        });
        renderChannels();
      });

      db.ref('chats/general').limitToLast(30).on('value', (snapshot) => {
        if (currentChatTab === 'general') renderChatFromSnap(snapshot.val());
      });
    }

    function enterServer() {
      if (!db) return alert("Cargando servicios, intenta de nuevo en un segundo...");
      const nick = document.getElementById('nickInput').value.trim();
      if (!nick) return alert("Escribe un nick válido.");

      myNick = nick;
      localStorage.setItem('wow_ts_nick', nick);

      document.getElementById('loginOverlay').classList.add('hidden');
      document.getElementById('mainContent').classList.remove('hidden');
      document.getElementById('mobileNav').classList.remove('hidden');

      db.ref('presence/' + myId).set({
        nick: myNick,
        room: 'lobby',
        talking: false
      });

      db.ref('presence/' + myId).onDisconnect().remove();
      joinChannel('lobby');
    }

    function renderChannels() {
      const tree = document.getElementById('channelTree');
      tree.innerHTML = "";

      Object.keys(rooms).forEach(rId => {
        const room = rooms[rId];
        const isCurrent = currentRoom === rId;
        const card = document.createElement('div');
        card.className = `channel-card ${isCurrent ? 'active' : ''}`;
        
        const userKeys = Object.keys(room.users);
        let usersHtml = userKeys.map(k => {
          const u = room.users[k];
          return `
            <div class="user-tag">
              <div class="user-dot ${u.talking ? 'speaking' : ''}"></div>
              <span>${u.nick}</span>
            </div>
          `;
        }).join('');

        card.innerHTML = `
          <div class="channel-header" onclick="joinChannel('${rId}')">
            <span>🔊 ${room.name}</span>
            <span style="font-size:0.75rem; color:#718096;">(${userKeys.length})</span>
          </div>
          <div class="channel-users">
            ${usersHtml || '<span style="font-size:0.7rem; color:#4a5568;">Vacío</span>'}
          </div>
        `;
        tree.appendChild(card);
      });
    }

    async function joinChannel(roomId) {
      if (!db) return;
      currentRoom = roomId;
      document.getElementById('currentRoomLabel').innerText = rooms[roomId].name;

      db.ref('presence/' + myId + '/room').set(roomId);

      db.ref('chats/' + roomId).limitToLast(30).on('value', (snapshot) => {
        if (currentChatTab === 'room') renderChatFromSnap(snapshot.val());
      });

      try {
        if (!localStream) {
          localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
          localStream.getAudioTracks()[0].enabled = false;
        }
      } catch(e) {}

      if (window.innerWidth < 768) showMobileTab('chat');
    }

    function leaveChannel() {
      if (!db) return;
      db.ref('presence/' + myId + '/room').set('lobby');
      currentRoom = 'lobby';
      document.getElementById('currentRoomLabel').innerText = rooms['lobby'].name;
    }

    function sendMsg() {
      if (!db) return;
      const input = document.getElementById('msgInput');
      const text = input.value.trim();
      if (!text) return;

      const path = currentChatTab === 'general' ? 'chats/general' : 'chats/' + currentRoom;
      
      db.ref(path).push({
        user: myNick,
        text: text,
        time: Date.now()
      });

      input.value = "";
    }

    function renderChatFromSnap(data) {
      const box = document.getElementById('chatBox');
      box.innerHTML = "";

      if (data) {
        Object.keys(data).forEach(k => {
          const m = data[k];
          const div = document.createElement('div');
          div.className = 'msg-item';
          div.innerHTML = `<span class="msg-user">${m.user}:</span> <span class="msg-text">${m.text}</span>`;
          box.appendChild(div);
        });
      }
      box.scrollTop = box.scrollHeight;
    }

    function switchChatTab(tab) {
      if (!db) return;
      currentChatTab = tab;
      document.getElementById('tabGenBtn').classList.toggle('active', tab === 'general');
      document.getElementById('tabRoomBtn').classList.toggle('active', tab === 'room');

      const path = tab === 'general' ? 'chats/general' : 'chats/' + currentRoom;
      db.ref(path).limitToLast(30).once('value', (snapshot) => {
        renderChatFromSnap(snapshot.val());
      });
    }

    function setupTouchEvents() {
      const btn = document.getElementById('touchPttBtn');
      btn.addEventListener('touchstart', (e) => { e.preventDefault(); startTalking(); });
      btn.addEventListener('touchend', (e) => { e.preventDefault(); stopTalking(); });
      btn.addEventListener('mousedown', startTalking);
      btn.addEventListener('mouseup', stopTalking);
    }

    function startTalking() {
      if (localStream) localStream.getAudioTracks()[0].enabled = true;
      document.getElementById('micStatusTag').innerText = "HABLANDO";
      document.getElementById('micStatusTag').style.background = "#38a169";
      document.getElementById('touchPttBtn').classList.add('active');
      if (db) db.ref('presence/' + myId + '/talking').set(true);
    }

    function stopTalking() {
      if (localStream) localStream.getAudioTracks()[0].enabled = false;
      document.getElementById('micStatusTag').innerText = "SILENCIADO";
      document.getElementById('micStatusTag').style.background = "#4a5568";
      document.getElementById('touchPttBtn').classList.remove('active');
      if (db) db.ref('presence/' + myId + '/talking').set(false);
    }

    function toggleMic() {
      const btn = document.getElementById('toggleMicBtn');
      if (btn.innerText.includes("OFF")) {
        btn.innerText = "Mic: ON";
        btn.style.borderColor = "#48bb78";
        startTalking();
      } else {
        btn.innerText = "Mic: OFF";
        btn.style.borderColor = "var(--border-gold)";
        stopTalking();
      }
    }

    function showMobileTab(tab) {
      const chanSec = document.getElementById('secChannels');
      const chatSec = document.getElementById('secChat');
      const chanBtn = document.getElementById('navChanBtn');
      const chatBtn = document.getElementById('navChatBtn');

      if (tab === 'channels') {
        chanSec.classList.remove('mobile-hidden');
        chatSec.classList.add('mobile-hidden');
        chanBtn.classList.add('active');
        chatBtn.classList.remove('active');
      } else {
        chanSec.classList.add('mobile-hidden');
        chatSec.classList.remove('mobile-hidden');
        chatBtn.classList.add('active');
        chanBtn.classList.remove('active');
      }
    }
  </script>
</body>
</html>
